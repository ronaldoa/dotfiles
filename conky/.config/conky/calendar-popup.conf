-- Calendar popup under the polybar clock; drawn by calendar-popup.lua.
-- Toggled by clicking the clock in polybar (polybar/script/calendar.sh).

conky.config = {
    own_window = true,
    -- override: i3 leaves it alone; the toggle script raises it above all windows (bin/xstack)
    own_window_type = 'override',
    own_window_class = 'calendar-popup',
    own_window_colour = '#00000000',
    own_window_hints = 'undecorated,sticky,skip_taskbar,skip_pager',
    double_buffer = true,

    -- Right edge roughly under the clock, just below the bar
    alignment = 'top_right',
    gap_x = 110,
    gap_y = 42,
    -- 446 x 250 card + 2px for its edge
    minimum_width = 448,
    maximum_width = 448,
    minimum_height = 252,
    border_inner_margin = 0,
    border_outer_margin = 0,

    -- Unused (the Lua script picks its own fonts) but stops conky looking for the X core font 6x10
    use_xft = true,
    font = 'Noto Sans CJK SC:size=10',

    -- Redraw often so month changes from the mouse hook show up right away
    update_interval = 0.2,

    lua_load = '~/.config/conky/calendar-popup.lua',
    lua_draw_hook_pre = 'calendar_popup',
    lua_mouse_hook = 'calendar_mouse',
}

conky.text = [[]]
