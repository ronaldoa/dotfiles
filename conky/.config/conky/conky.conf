-- Desktop widget in the top-right corner: clock, weather, system, now playing.
-- Sits below all windows, so it shows on empty workspaces.
-- Toggle with Super+D (i3/bin/widgets). Weather comes from the polybar weather cache.

conky.config = {
    own_window = true,
    -- override: i3 leaves it alone (a managed window would float above everything); bin/widgets lowers it to the bottom
    own_window_type = 'override',
    own_window_class = 'conky',
    own_window_colour = '#00000000',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    double_buffer = true,

    alignment = 'top_right',
    gap_x = 60,
    gap_y = 90,
    minimum_width = 380,
    maximum_width = 380,

    update_interval = 1,
    use_xft = true,
    -- Xft has no per-glyph fallback: text uses the CJK font, icons switch to the Nerd Font with ${font}
    font = 'Noto Sans CJK SC:size=11',
    override_utf8_locale = true,
    draw_shades = true,
    default_shade_color = '2E3440',
    draw_outline = false,
    draw_borders = false,
    default_color = 'D8DEE9',
    color1 = 'ECEFF4',
    color2 = '88C0D0',
    color3 = '4C566A',
    color4 = 'EBCB8B',
    cpu_avg_samples = 2,
    net_avg_samples = 2,
}

conky.text = [[
${alignr}${color1}${font Hack Nerd Font:bold:size=64}${time %H:%M}${font}
${alignr}${color2}${font Noto Sans CJK SC:size=14}${time %Y-%m-%d}  ${execi 3600 LC_TIME=zh_CN.UTF-8 date +%A}${font}

${alignr}${color4}${font Noto Sans CJK SC:size=13}${execi 300 jq -r '.current | "\(.weather[0].description)  \(.main.temp | round)°C  体感 \(.main.feels_like | round)°C"' ~/.cache/polybar-weather.json 2>/dev/null}${font}

${color2}${font Hack Nerd Font:size=11}${font} CPU ${color}${alignr}${cpu cpu0}%
${color3}${cpubar cpu0 6}
${color2}${font Hack Nerd Font:size=11}${font} 内存 ${color}${alignr}${mem} / ${memmax}
${color3}${membar 6}
${color2}${font Hack Nerd Font:size=11}󰋊${font} 磁盘 ${color}${alignr}${fs_used /} / ${fs_size /}
${color3}${fs_bar 6 /}
${color2}${font Hack Nerd Font:size=11}${font} 运行 ${color}${alignr}${uptime_short}

${if_match "${execi 2 mpc status '%state%'}" == "playing"}${color2}${font Hack Nerd Font:size=11}${font} ${color1}${execi 2 mpc current -f '%title%'}
${color}${alignr}${execi 2 mpc current -f '%artist%'}
${color3}${execibar 2 mpc status '%percenttime%' | tr -dc 0-9}$endif
]]
