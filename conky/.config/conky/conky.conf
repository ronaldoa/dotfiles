-- Apple-style desktop widgets: clock, weather, system, network, storage, now playing.
-- Everything is drawn by widgets.lua (Cairo); this file only sets up the transparent window.
-- Sits below all windows, so it shows on empty workspaces.
-- Toggle with Super+D (i3/bin/widgets). Weather comes from the polybar weather cache.

conky.config = {
    own_window = true,
    -- override: i3 leaves it alone (a managed window would float above everything); bin/widgets lowers it to the bottom
    own_window_type = 'override',
    own_window_class = 'conky',
    own_window_colour = '#00000000',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    double_buffer = true,

    alignment = 'top_right',
    gap_x = 40,
    gap_y = 60,
    -- 2x2 cards of 164, three 14px gaps, 134px storage and 96px music (+2px edges)
    minimum_width = 344,
    maximum_width = 344,
    minimum_height = 602,
    border_inner_margin = 0,
    border_outer_margin = 0,

    -- Unused (widgets.lua picks its own fonts) but stops conky looking for the X core font 6x10
    use_xft = true,
    font = 'Noto Sans CJK SC:size=10',

    update_interval = 1,
    cpu_avg_samples = 2,
    net_avg_samples = 2,

    lua_load = '~/.config/conky/widgets.lua',
    lua_draw_hook_pre = 'main',
}

conky.text = [[]]
