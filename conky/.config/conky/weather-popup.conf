-- Weather popup under the polybar weather module; drawn by weather-popup.lua.
-- Toggled by clicking the weather in polybar (polybar/script/weather.sh --detail).

conky.config = {
    own_window = true,
    -- override: i3 leaves it alone; the toggle script raises it above all windows (bin/xstack)
    own_window_type = 'override',
    own_window_class = 'weather-popup',
    own_window_colour = '#00000000',
    own_window_hints = 'undecorated,sticky,skip_taskbar,skip_pager',
    double_buffer = true,

    -- The toggle script passes -x/-y from bin/popup-pos: centred under the mouse, just below the bar
    alignment = 'top_left',
    -- 400 x 290 card + 2px for its edge
    minimum_width = 402,
    maximum_width = 402,
    minimum_height = 292,
    border_inner_margin = 0,
    border_outer_margin = 0,

    -- Unused (the Lua script picks its own fonts) but stops conky looking for the X core font 6x10
    use_xft = true,
    font = 'Noto Sans CJK SC:size=10',

    update_interval = 5,

    lua_load = '~/.config/conky/weather-popup.lua',
    lua_draw_hook_pre = 'weather_popup',
}

conky.text = [[]]
