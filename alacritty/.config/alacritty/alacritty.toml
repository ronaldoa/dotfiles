
[colors]
draw_bold_text_with_bright_colors = false

[cursor]
vi_mode_style = "None"

[cursor.style]
blinking = "Off"
shape = "Block"

[env]
TERM = "xterm-256color"

[font]
size = 14
#use_thin_strokes = true

[font.bold]
family = "Hack Nerd Font"
style = "Bold"

[font.italic]
family = "Hack Nerd Font"
style = "Italic"

[font.normal]
family = "Hack Nerd Font"
style = "Regular"

#[font.offset]
#x = 1
#y = 0

[mouse]
hide_when_typing = false

#[mouse.url]
#modifiers = "Command"

[scrolling]
history = 100000
multiplier = 3

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"


[selection]
save_to_clipboard = true
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t@="

[window]
opacity = 1.0

dimensions = { columns = 120, lines = 30 }

padding = { x = 20, y = 10 }

[general]
# Later imports override earlier ones; missing files are skipped.
# ~/.cache/theme/alacritty.toml is written by ~/.config/i3/bin/theme (pywal colours, or empty for the default)
# dotfiles-host/alacritty.toml is per-machine (font size etc.), stowed from hosts/<hostname>/
import = ["~/.config/alacritty/colors.toml", "~/.cache/theme/alacritty.toml", "~/.config/dotfiles-host/alacritty.toml"]
#background_opacity = 0.95
live_config_reload = true

[terminal]
#[window.dimensions]
#columns = 120
#lines = 30

[terminal.shell]
program = "/bin/zsh"
args = ["-lc", '''
if [ -n "$TMUX" ]; then
  exec zsh
fi
# 只复用「未 attach 且所有 pane 都是空闲 zsh」的 session，没有才新建
target=$(tmux ls -F '#{session_attached} #{session_name}' 2>/dev/null | awk '$1==0{print $2}' | while read -r s; do
  [ "$(tmux list-panes -t "$s" -F '#{pane_current_command}' 2>/dev/null | sort -u)" = zsh ] && { echo "$s"; break; }
done)
if [ -n "$target" ]; then
  tmux attach -t "$target"
else
  tmux new-session
fi
exec zsh
''']
