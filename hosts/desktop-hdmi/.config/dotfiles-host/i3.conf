# ===========================================================================
# Desktop with an external 2560x1440 monitor on HDMI-0 (NVIDIA).
#
# !! RENAME THIS DIRECTORY to that machine's `hostname` before using it:
#      git mv hosts/desktop-hdmi hosts/$(hostname)
#    bin/dotfiles-bootstrap looks up hosts/<hostname>/ and nothing else.
#
# These lines lived in the generic i3 config until the hosts/ split; they are
# the settings that are meaningless on a laptop.
# ===========================================================================

# Force the external monitor's mode/refresh rate.
exec --no-startup-id xrandr --output HDMI-0 --mode 2560x1440 --rate 99.95

# Warn if the pinned monitor EDID (xorg.conf.d/20-nvidia-connected-monitor.conf)
# no longer matches the live monitor.
exec --no-startup-id sh -c "sleep 10; ~/.config/i3/bin/edid-check"

# Brightness of the external monitor via DDC/CI (needs the `ddcutil` package).
bindsym XF86MonBrightnessUp   exec --no-startup-id ddcutil --noverify setvcp 10 + 10
bindsym XF86MonBrightnessDown exec --no-startup-id ddcutil --noverify setvcp 10 - 10
