# MacBook Pro (hostname: QingyuZhoudeMacBook-Pro) -- 14" Liquid Retina XDR.
#
# Font size is the only [font] key a host can set: the generic alacritty.toml sets
# the family (Hack Nerd Font), and a key in the importing file beats the import.
#
# keyboard.bindings is an array, and alacritty appends arrays from imports rather
# than replacing them, so these add to the generic Ctrl+Shift+C/V bindings.

[font]
size = 18

# Cmd+key sends the tmux prefix (Ctrl+B) followed by a tmux key, so tmux can be
# driven like a tabbed terminal: Cmd+T new window, Cmd+1..9 select it, Cmd+H/J/K/L
# move between panes, Cmd+Shift+H/J/K/L resize, Cmd+S / Cmd+D split, ...
[[keyboard.bindings]]
chars = "\u0002["
key = "LBracket"
mods = "Command"

[[keyboard.bindings]]
chars = "\u0002%"
key = "S"
mods = "Command"

[[keyboard.bindings]]
chars = "\u0002j"
key = "J"
mods = "Command"

[[keyboard.bindings]]
chars = "\u0002k"
key = "K"
mods = "Command"

[[keyboard.bindings]]
chars = "\u0002h"
key = "H"
mods = "Command"

[[keyboard.bindings]]
chars = "\u0002l"
key = "L"
mods = "Command"

[[keyboard.bindings]]
chars = "\u0002J"
key = "J"
mods = "Command|Shift"

[[keyboard.bindings]]
chars = "\u0002K"
key = "K"
