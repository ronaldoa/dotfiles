# ===========================================================================
# Desktop (hostname: ronaldo-ms7c94): NVIDIA RTX 4060 Ti, external 27" 2560x1440
# monitor on HDMI-0.
#
# Included at the END of ~/.config/i3/config, so bindsym here wins over the
# generic config above it.
# ===========================================================================

# No xrandr line here: bin/display in the generic config picks each monitor's
# preferred mode at its highest refresh rate (2560x1440 @ 99.95 Hz on this one).
# edid-check is also started by the generic config (it exits silently on machines
# without the pinned-EDID xorg file), so it isn't repeated here.

# Brightness of the external monitor via DDC/CI (needs the `ddcutil` package).
bindsym XF86MonBrightnessUp   exec --no-startup-id ddcutil --noverify setvcp 10 + 10
bindsym XF86MonBrightnessDown exec --no-startup-id ddcutil --noverify setvcp 10 - 10
