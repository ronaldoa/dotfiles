# ===========================================================================
# ThinkPad T460p (hostname: ronaldo-20fwa023cd)
# Laptop: single internal panel eDP-1 1920x1080, Intel HD530 + NVIDIA 940MX.
#
# Included at the END of ~/.config/i3/config, so bindsym here wins over the
# generic config above it.
# ===========================================================================

# No xrandr line: the only output is the internal panel, X brings it up itself.

# Backlight. The generic config leaves brightness unbound because the desktop
# drives an external monitor over DDC/CI (ddcutil) instead -- ddcutil is not
# installed here and would have no external monitor to talk to anyway.
# /usr/bin/light is setuid root, so no video-group membership is needed.
bindsym XF86MonBrightnessUp   exec --no-startup-id light -A 5
bindsym XF86MonBrightnessDown exec --no-startup-id light -U 5
