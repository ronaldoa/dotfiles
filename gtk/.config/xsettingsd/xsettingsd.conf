# GTK theme, icons, cursor and font for apps in the i3 session (started from the i3 config).
# GTK apps read these live over XSETTINGS; restart xsettingsd (or `pkill -HUP xsettingsd`) after editing.
# The gtk-3.0/gtk-4.0 settings.ini and ~/.gtkrc-2.0 carry the same values for when it isn't running.

Net/ThemeName "Nordic"
Net/IconThemeName "Papirus-Dark"
Gtk/CursorThemeName "breeze-cursors"
Gtk/CursorThemeSize 24
Gtk/FontName "Noto Sans CJK SC 11"
Gtk/MonospaceFontName "Hack Nerd Font 11"
Net/EnableEventSounds 0
Net/EnableInputFeedbackSounds 0
Xft/Antialias 1
Xft/Hinting 1
Xft/HintStyle "hintslight"
Xft/RGBA "rgb"
