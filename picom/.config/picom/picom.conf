
#Custom Stuff
backend = "glx";
#glx-no-stencil = true;
#glx-no-rebind-pixmap = true;
vsync = true;


# Generic default; i3/bin/compositor disables damage tracking only when an NVIDIA
# driver drives a connected screen (the existing workaround for NVIDIA flicker).
use-damage = true;

# Rounded corners (exceptions are in the rules below)
corner-radius = 10;

blur: {
  method = "dual_kawase";
  strength = 7;
}

# Shadow
shadow = true;			# Enabled client-side shadows on windows.
# The blur radius for shadows. (default 12)
shadow-radius = 12;
# The left offset for shadows. (default -15)
shadow-offset-x = -5;
# The top offset for shadows. (default -15)
shadow-offset-y = -5;
# The translucency for shadows. (default .75)
shadow-opacity = 0.5;

# Opacity
frame-opacity = 1.0;			# Opacity of window titlebars and borders. (0.1 - 1.0)

# Fading
fading = true;			# Fade windows during opacity changes.
fade-delta = 3;		# The time between steps in a fade in milliseconds. (default 10).
fade-in-step = 0.03;		# Opacity change between steps while fading in. (default 0.028).
fade-out-step = 0.03;		# Opacity change between steps while fading out. (default 0.03).
# no-fading-openclose = true;	# Fade windows in/out when opening/closing.

# Other
detect-rounded-corners = true;
detect-client-opacity = true;

# Window rules (picom v12+). They replace shadow-exclude, opacity-rule,
# blur-background-exclude, inactive-opacity and wintypes.
# Rules are applied in order; when several set the same option, the last one wins.
rules = (
  # Open: scale up + fade in. Close: scale down + fade out.
  # i3 unmaps windows when you leave a workspace, so this also animates workspace switches.
  # Geometry: when tiling moves or resizes a window, it glides to its new place (experimental in picom)
  { animations = (
      { triggers = [ "open" ]; preset = "appear"; scale = 0.9; duration = 0.2; },
      { triggers = [ "close" ]; preset = "disappear"; scale = 0.9; duration = 0.15; },
      { triggers = [ "geometry" ]; preset = "geometry-change"; duration = 0.2; }
    ); },

  # Unfocused windows are lightly dimmed and a little translucent, so the blurred
  # wallpaper shows through. WM-drawn and override-redirect windows (polybar,
  # menus) count as focused, like the old mark-*-focused options did.
  { match = "!(focused || group_focused || wmwin || override_redirect)"; dim = 0.1; opacity = 0.9; },

  # Floating windows are slightly translucent so the blur behind them shows
  { match = "I3_FLOATING_WINDOW = 1"; opacity = 0.92; },

  # Translucent + blurred launcher
  { match = "class_g *?= 'Rofi'"; opacity = 0.92; corner-radius = 18; },

  # Never translucent or dimmed: browsers, video, PDFs, picture-in-picture
  { match = "class_g = 'firefox' || class_g = 'Chromium' || class_g = 'mpv' || class_g = 'Zathura' || name = 'Picture-in-Picture' || name = '画中画'"; opacity = 1; dim = 0; },

  # Drop-down terminal (i3/bin/dropdown) slides down from the top and back up
  { match = "class_i = 'dropdown'"; animations = (
      { triggers = [ "open" ]; preset = "slide-in"; direction = "down"; duration = 0.2; },
      { triggers = [ "close" ]; preset = "slide-out"; direction = "up"; duration = 0.15; }
    ); },

  # Noi and the WeChat main window (i3/bin/noi-toggle, wechat-toggle) live in the scratchpad: slide like the drop-down terminal
  { match = "class_g = 'Noi' || (class_g = 'wechat' && name = 'Weixin')"; animations = (
      { triggers = [ "open" ]; preset = "slide-in"; direction = "down"; duration = 0.2; },
      { triggers = [ "close" ]; preset = "slide-out"; direction = "up"; duration = 0.15; }
    ); },

  { match = "window_type = 'tooltip'"; fade = true; shadow = true; opacity = 0.75; },

  # Desktop lyrics (i3/bin/lyrics): Alacritty makes only the background translucent,
  # so keep the text fully opaque and blur what's behind it; no shadow on the floating panel
  { match = "class_i = 'lyrics'"; opacity = 1; dim = 0; blur-background = true; shadow = false; },
  # Same for the audio visualizer window (i3/bin/cava-toggle)
  { match = "class_i = 'cava'"; opacity = 1; dim = 0; blur-background = false; shadow = false; corner-radius = 0; },

  # No shadows on Chromium's own decorations and a few popups
  { match = "class_g ?= 'Xfce4-power-manager' || name *= 'Chromium' || name *= 'Chrome' || name *= 'VLC'"; shadow = false; },

  # dunst draws its own rounded, translucent cards: no rectangular shadow, blur, clipping or dimming
  { match = "class_g = 'Dunst'"; corner-radius = 0; shadow = false; blur-background = false; dim = 0; },

  # Don't blur behind the bar or the desktop
  { match = "window_type = 'dock' || window_type = 'desktop' || class_g = 'conky'"; blur-background = false; },

  # Weather and calendar popups (conky) draw their own rounded card: no rectangular shadow, blur or clipping; keep the open/close animation
  { match = "class_g = 'weather-popup' || class_g = 'calendar-popup'"; corner-radius = 0; dim = 0; shadow = false; blur-background = false; },

  # Square corners, no dimming, no animation: bar, desktop widgets (conky), fullscreen.
  # An empty animations list would keep the triggers set by earlier rules, so override each one
  # with a script that does nothing; with no animation at all picom would fall back to fading = true.
  { match = "window_type = 'dock' || window_type = 'desktop' || class_g = 'conky' || fullscreen"; corner-radius = 0; dim = 0; shadow = false; fade = false; animations = (
      { triggers = [ "open", "close", "show", "hide", "geometry" ]; none = 0; }
    ); },

  # fcitx5's candidate box moves and resizes with every key: no open/close or glide animation
  # (see the rule above for why it's a do-nothing script and not an empty list)
  { match = "class_g = 'fcitx'"; fade = false; animations = (
      { triggers = [ "open", "close", "show", "hide", "geometry" ]; none = 0; }
    ); },
)
