; Automatic night light, started by i3 at login (Super+R a re-applies it).
; 6500K (the screen's own white, so colours stay accurate) by day, 4000K at night.
[redshift]
temp-day=6500
temp-night=4000
fade=1
; Fixed location instead of geoclue, which needs a running agent and network.
; Boston, the same city as the polybar weather module.
location-provider=manual
adjustment-method=randr

[manual]
lat=42.36
lon=-71.06
