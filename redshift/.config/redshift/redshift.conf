; Automatic night light, started by i3/bin/nightlight at login (Super+R a re-applies it).
; 6500K (the screen's own white, so colours stay accurate) by day, 4000K at night.
[redshift]
temp-day=6500
temp-night=4000
fade=1
; bin/nightlight passes the current location (bin/location, by IP) with -l, which overrides this.
; This fixed one (Boston) is only for redshift run by hand; geoclue would need a running agent.
location-provider=manual
adjustment-method=randr

[manual]
lat=42.36
lon=-71.06
